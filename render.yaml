services:
  - type: web
    name: lmha-backend
    env: node
    rootDir: lmha-system/backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ROOT_ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: BACKEND_URL
        sync: false
      # If using the Vercel same-origin proxy, set BACKEND_URL to the Vercel
      # frontend origin so Google OAuth callbacks land on /auth/google/callback
      # and are proxied to Render.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SPREADSHEET_ID_LMHA
        sync: false
      - key: SPREADSHEET_ID_SOLACE
        sync: false
      - key: APP_TIME_ZONE
        value: Europe/Dublin
